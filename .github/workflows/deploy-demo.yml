name: Deploy Demo to GitHub Pages

# The demo renders the working tree, so it is only current while it tracks main.
# Deploying every push keeps that true without a paths filter deciding which
# commits matter -- a filter that guessed wrong would leave the demo silently
# stale, which is the failure this trigger exists to prevent.
#
# Tags are deliberately not a trigger. The github-pages environment only accepts
# deployments from main, so a tag run can only ever be rejected -- and because
# every run shares the `pages` concurrency group, that doomed run cancels the
# main-branch deploy pushed moments earlier. Tagging would then leave the demo
# stale, which is exactly what this workflow exists to prevent. A release commit
# reaches main on its own push, so nothing is lost.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

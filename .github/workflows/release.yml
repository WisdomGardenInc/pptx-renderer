name: Release

# Publishes to npm with trusted publishing (OIDC): no NPM_TOKEN is stored
# anywhere. npm trades this workflow's short-lived GitHub identity for a
# publish credential, so the trusted publisher registered on npmjs.com must
# name this repository and this file (release.yml) exactly.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mints the OIDC token npm authenticates with

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # publishing is irreversible; never cut a run short

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 24 for the >= 22.14 trusted-publishing floor. No dependency cache:
      # a release resolves everything from the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which is newer than some Node
      # bundles ship.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the tag names the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $declared"
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:package
      - run: pnpm size
      - run: pnpm publint

      # No NODE_AUTH_TOKEN: the OIDC exchange supplies the credential, and
      # provenance is attested from this workflow run.
      - run: npm publish --provenance --access public
